name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── TypeScript ───────────────────────────────────────────────────────────────
  ts:
    name: TypeScript (lint + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:ts

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # ── Go ───────────────────────────────────────────────────────────────────────
  go:
    name: Go (lint + build + test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingest, writer, query]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/${{ matrix.service }}

  # ── Docker compose smoke test ─────────────────────────────────────────────────
  smoke:
    name: M1 smoke test
    runs-on: ubuntu-latest
    needs: [ts, go]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Start services
        run: docker compose -f infra/docker-compose.yml up -d --build

      - name: Wait for ingest and query
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && \
            curl -sf http://localhost:8081/health && break
            echo "Waiting for services ($i/30)..."
            sleep 5
          done

      - name: Run smoke test
        run: bash scripts/smoke-test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs

      - name: Teardown
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
