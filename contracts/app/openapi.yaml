openapi: '3.1.0'
info:
  title: Cascade App API
  version: '1.0.0'
  description: |
    Dashboard and organization CRUD API. Backed by Postgres, owned by A3 (Dashboard)
    and A5 (Auth). The query execution is proxied to the Query API.

servers:
  - url: http://localhost:3001
    description: Local dev

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ── Dashboards ──────────────────────────────────────────────────────────────

  /v1/dashboards:
    get:
      summary: List dashboards for the current org
      operationId: listDashboards
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of dashboards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create a dashboard
      operationId: createDashboard
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDashboardRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/dashboards/{dashboardId}:
    parameters:
      - name: dashboardId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a dashboard
      operationId: getDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a dashboard
      operationId: updateDashboard
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDashboardRequest'
      responses:
        '200':
          description: Updated dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
    delete:
      summary: Delete a dashboard
      operationId: deleteDashboard
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted

  # ── Widgets ──────────────────────────────────────────────────────────────────

  /v1/dashboards/{dashboardId}/widgets:
    parameters:
      - name: dashboardId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Add a widget to a dashboard
      operationId: createWidget
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWidgetRequest'
      responses:
        '201':
          description: Widget created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'

  /v1/dashboards/{dashboardId}/widgets/{widgetId}:
    parameters:
      - name: dashboardId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: widgetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Update a widget
      operationId: updateWidget
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWidgetRequest'
      responses:
        '200':
          description: Updated widget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
    delete:
      summary: Delete a widget
      operationId: deleteWidget
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    WidgetPosition:
      type: object
      required: [x, y, w, h]
      properties:
        x: { type: integer }
        y: { type: integer }
        w: { type: integer }
        h: { type: integer }

    WidgetConfig:
      type: object
      required: [event]
      properties:
        event: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        interval:
          type: string
          enum: [minute, hour, day]
        breakdown: { type: string }

    Widget:
      type: object
      required: [id, dashboard_id, title, type, config, position, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        dashboard_id: { type: string, format: uuid }
        title: { type: string }
        type:
          type: string
          enum: [number, timeseries, funnel, table]
        config:
          $ref: '#/components/schemas/WidgetConfig'
        position:
          $ref: '#/components/schemas/WidgetPosition'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Dashboard:
      type: object
      required: [id, org_id, name, widgets, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/Widget'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateDashboardRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }

    UpdateDashboardRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }

    CreateWidgetRequest:
      type: object
      required: [title, type, config]
      properties:
        title: { type: string }
        type:
          type: string
          enum: [number, timeseries, funnel, table]
        config:
          $ref: '#/components/schemas/WidgetConfig'
        position:
          $ref: '#/components/schemas/WidgetPosition'

    UpdateWidgetRequest:
      type: object
      properties:
        title: { type: string }
        config:
          $ref: '#/components/schemas/WidgetConfig'
        position:
          $ref: '#/components/schemas/WidgetPosition'

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        postgres:
          type: string
          enum: [ok, error]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

  responses:
    Unauthorized:
      description: Missing or invalid auth token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
