x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # ── Data stores ─────────────────────────────────────────────────────────────

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: cascade-clickhouse
    ports:
      - '8123:8123' # HTTP
      - '9000:9000' # native TCP
    environment:
      CLICKHOUSE_DB: cascade
      CLICKHOUSE_USER: cascade
      CLICKHOUSE_PASSWORD: cascade
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/cascade.xml:ro
      - ./clickhouse/users.d/cascade_profile.xml:/etc/clickhouse-server/users.d/cascade_profile.xml:ro
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8123/ping || exit 1']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    logging: *default-logging

  postgres:
    image: postgres:16
    container_name: cascade-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: cascade
      POSTGRES_USER: cascade
      POSTGRES_PASSWORD: cascade
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cascade']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    container_name: cascade-redis
    ports:
      - '6379:6379'
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging

  # ── Services (M1 slice) ──────────────────────────────────────────────────────

  ingest:
    build:
      context: ../services/ingest
      dockerfile: Dockerfile
    container_name: cascade-ingest
    ports:
      - '8080:8080'
    environment:
      PORT: '8080'
      REDIS_URL: 'redis://redis:6379'
      REDIS_STREAM: 'ingest:stream'
      LOG_LEVEL: 'info'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8080/health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  writer:
    build:
      context: ../services/writer
      dockerfile: Dockerfile
    container_name: cascade-writer
    environment:
      REDIS_URL: 'redis://redis:6379'
      REDIS_STREAM: 'ingest:stream'
      REDIS_CONSUMER_GROUP: 'writer-group'
      CLICKHOUSE_DSN: 'clickhouse://cascade:cascade@clickhouse:9000/cascade'
      BATCH_SIZE: '1000'
      FLUSH_INTERVAL_MS: '500'
      LOG_LEVEL: 'info'
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    logging: *default-logging

  query:
    build:
      context: ../services/query
      dockerfile: Dockerfile
    container_name: cascade-query
    ports:
      - '8081:8081'
    environment:
      PORT: '8081'
      CLICKHOUSE_DSN: 'clickhouse://cascade:cascade@clickhouse:9000/cascade'
      REDIS_URL: 'redis://redis:6379'
      QUERY_CACHE_TTL_SECONDS: '30'
      LOG_LEVEL: 'info'
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8081/health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  auth:
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    container_name: cascade-auth
    ports:
      - '8083:8083'
    environment:
      PORT: '8083'
      DATABASE_URL: 'postgresql://cascade:cascade@postgres:5432/cascade'
      JWT_SECRET: 'cascade-dev-secret-do-not-use-in-production-xx'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8083/health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

  dashboard:
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_INGEST_URL: 'http://localhost:8080'
        VITE_QUERY_URL: 'http://localhost:8081'
        VITE_APP_URL: 'http://localhost:3001'
    container_name: cascade-dashboard
    ports:
      - '3000:3000'
    depends_on:
      ingest:
        condition: service_healthy
      query:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

volumes:
  clickhouse-data:
  postgres-data:
  redis-data:
